<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잉툰 챌린지 · 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Nunito:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E3A4F; --sky:#47AEE4; --sky-deep:#2E90C8; --sky-soft:#E3F3FC;
  --paper:#FBFBF4; --card:#FFFFFF; --sun:#FFD34D; --coral:#FF7B6B; --green:#2FBF87;
  --line:2.5px solid var(--ink); --pop:4px 4px 0 var(--ink); --pop-sm:3px 3px 0 var(--ink); --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--sky-soft);
  background-image:radial-gradient(#c9e6f7 1.5px, transparent 1.5px);background-size:22px 22px;
  min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;background:var(--paper);min-height:100vh;border-left:var(--line);border-right:var(--line);padding-bottom:30px}

/* ---------- 로그인 ---------- */
#loginScr{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;background:var(--ink);background-image:radial-gradient(#2e4f68 2px, transparent 2px);background-size:26px 26px}
.lg-wrap{text-align:center;margin-bottom:26px}
.lg-face{width:84px;height:84px;margin:0 auto 12px;border:3px solid #fff;border-radius:50%;background:#fff;box-shadow:5px 5px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:40px}
.lg-title{font-family:'Jua';font-size:26px;color:#fff}
.lg-sub{margin-top:6px;font-size:12.5px;font-weight:700;color:#9fc3da}
.lg-card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:22px 18px}
.lg-card label{display:block;font-family:'Jua';font-size:13px;margin:2px 0 6px}
.lg-card input{width:100%;border:2px solid var(--ink);border-radius:10px;padding:12px;font-size:15px;background:#fff;margin-bottom:14px}
.lg-btn{width:100%;font-family:'Jua';font-size:16px;background:var(--sky);color:#fff;text-shadow:1px 1px 0 var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:12px;cursor:pointer;box-shadow:var(--pop)}
.lg-btn:disabled{opacity:.6}
.lg-err{font-size:12px;color:var(--coral);font-weight:700;text-align:center;margin-top:10px;display:none}
.lg-err.show{display:block}

/* ---------- 메인 ---------- */
#mainScr{display:none}
.topbar{background:var(--ink);border-bottom:var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:20}
.topbar .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-family:'Jua';font-size:17px;color:#fff}
.brand .adm{font-size:10.5px;background:var(--coral);border:2px solid #fff;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.rolebadge{font-size:10.5px;background:#fff;border-radius:999px;padding:2px 9px;font-weight:800;margin-left:6px;color:var(--ink)}
.logoutbtn{background:rgba(255,255,255,.92);border:none;border-radius:9px;font-size:11px;font-weight:800;padding:5px 10px;cursor:pointer;color:var(--ink)}
.stage{padding:16px}
.card{background:var(--card);border:var(--line);border-radius:var(--r);box-shadow:var(--pop);margin-bottom:16px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:var(--line);background:var(--sky-soft);cursor:pointer;user-select:none}
.card-h .arrow{margin-left:2px;font-size:11px;transition:transform .2s}
.card.folded .card-h .arrow{transform:rotate(-90deg)}
.card.folded .card-h{border-bottom:none}
.card.folded .card-b{display:none}
.claim-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;background:#FFF3D6;color:#B8860B;border:1.5px solid var(--sun);border-radius:999px;padding:3px 10px}
.claim-badge.mine{background:#E4F8EF;color:var(--green);border-color:var(--green)}
.dash-row{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid #e3edf3;padding:9px 2px;font-size:12.5px}
.dash-row:last-child{border-bottom:none}
.dash-rank{width:26px;font-family:'Jua';font-size:13px;text-align:center;color:#7b93a4}
.dash-name{flex:1;font-family:'Jua';font-size:13px}
.dash-stat{font-size:11px;font-weight:800;color:var(--sky-deep);background:var(--sky-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.dash-last{font-size:10px;color:#7b93a4;white-space:nowrap}
.co-row{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid #e3edf3;padding:9px 2px;font-size:13px}
.co-row:last-child{border-bottom:none}
.co-name{font-family:'Jua';font-size:13px;min-width:56px}
.co-sub{color:#7b93a4;font-size:11.5px;flex:1}
.co-btn{font-family:'Jua';font-size:11px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;padding:5px 10px;cursor:pointer;color:var(--ink)}
.co-btn.add{background:var(--sky);color:#fff;border-color:var(--ink)}
.co-btn.del{color:var(--coral);border-color:var(--coral)}
.step-no{font-family:'Jua';font-size:12px;background:var(--ink);color:#fff;border-radius:8px;padding:2px 8px}
.card-h b{font-family:'Jua';font-size:15px;font-weight:400}
.card-h .hint{margin-left:auto;font-size:11px;color:#5a7285}
.card-b{padding:14px}
.form{display:flex;flex-direction:column;gap:9px}
.form input,.form select{border:1.5px solid #cfe0ea;border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;font-family:'Noto Sans KR'}
.row2{display:flex;align-items:center;gap:10px}
.row2 label{font-family:'Jua';font-size:12.5px;color:var(--sky-deep);white-space:nowrap}
.row2 input{flex:1}
.hintline{font-size:11px;color:#7b93a4;line-height:1.6}
.pbtn{font-family:'Jua';font-size:14px;background:var(--sky);color:#fff;text-shadow:1px 1px 0 var(--ink);border:2px solid var(--ink);border-radius:10px;padding:10px;cursor:pointer;box-shadow:var(--pop-sm)}
.pbtn:disabled{opacity:.6}
.roletabs{display:flex;gap:8px;margin-bottom:11px}
.roletab{flex:1;font-family:'Jua';font-size:13px;background:#fff;border:1.5px solid #cfe0ea;border-radius:10px;padding:8px;cursor:pointer;text-align:center;color:var(--ink)}
.roletab.on{background:var(--sky);color:#fff;border-color:var(--sky)}
.srow{display:flex;align-items:center;gap:9px;border-bottom:1.5px solid #e3edf3;padding:10px 2px;font-size:13px}
.srow:last-child{border-bottom:none}
.sname{font-family:'Jua';font-size:13.5px;min-width:56px}
.sid{color:#7b93a4;font-size:11.5px;flex:1}
.sexp{font-size:10.5px;font-weight:800;color:var(--sky-deep);background:var(--sky-soft);border-radius:999px;padding:2px 8px}
.sexp.warn{color:#fff;background:var(--coral)}
.empty{text-align:center;font-size:12.5px;color:#7b93a4;padding:14px 0}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:9px 18px;z-index:70;display:none;max-width:86%;text-align:center}
.toast.show{display:block}
</style>
</head>
<body>
<div class="app">

  <div id="loginScr">
    <div class="lg-wrap">
      <div class="lg-face">👩‍🏫</div>
      <div class="lg-title">잉툰 챌린지</div>
      <div class="lg-sub">관리자 로그인</div>
    </div>
    <div class="lg-card">
      <label>아이디</label>
      <input id="lg-id" placeholder="아이디" autocomplete="username">
      <label>비밀번호</label>
      <input id="lg-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button class="lg-btn" id="lg-btn" onclick="doLogin()">로그인</button>
      <div class="lg-err" id="lg-err"></div>
    </div>
  </div>

  <div id="mainScr">
    <div class="topbar">
      <div class="row">
        <div class="brand">잉툰 챌린지<span class="adm">관리자</span><span class="rolebadge" id="roleBadge"></span></div>
        <button class="logoutbtn" onclick="doLogout()">로그아웃</button>
      </div>
    </div>
    <div class="stage">

      <div class="card" id="card-qna">
        <div class="card-h" onclick="toggleCard('card-qna')"><span class="step-no">Q&amp;A</span><b>질문 관리</b><span class="hint" id="qnaCount"></span><span class="arrow">▼</span></div>
        <div class="card-b">
          <div class="roletabs">
            <button class="roletab on" id="qtabWait" onclick="setQnaAdminTab('wait')">⏳ 미답변</button>
            <button class="roletab" id="qtabDone" onclick="setQnaAdminTab('done')">✅ 답변완료</button>
          </div>
          <div id="qnaList"><div class="empty">불러오는 중...</div></div>
        </div>
      </div>

      <div class="card folded" id="card-cohort">
        <div class="card-h" onclick="toggleCard('card-cohort')"><span class="step-no">기수</span><b>기수 관리 · 학생 배정</b><span class="hint" id="cohortHint"></span><span class="arrow">▼</span></div>
        <div class="card-b">
          <div id="cohortNewForm" style="display:none;margin-bottom:14px">
            <div class="form">
              <input id="co-name" placeholder="기수 이름 (예: 7기)">
              <select id="co-ch">
                <option value="1">100일 영어 습관 챌린지</option>
                <option value="2">구동사 200 챌린지</option>
              </select>
              <div class="row2"><label>시작일</label><input id="co-start" type="date"></div>
              <button class="pbtn" onclick="createCohort()">➕ 기수 만들기</button>
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:12px">
            <select id="cohortSel" onchange="onCohortChange()" style="flex:1;border:1.5px solid #cfe0ea;border-radius:10px;padding:9px 11px;font-size:13.5px;background:#fff;font-family:'Noto Sans KR'"></select>
            <button class="co-btn" id="btnNewCohort" onclick="toggleNewCohortForm()" style="display:none">➕ 새 기수</button>
          </div>
          <div id="cohortBody"><div class="empty">기수를 선택해 주세요</div></div>
        </div>
      </div>

      <div class="card folded" id="card-dash">
        <div class="card-h" onclick="toggleCard('card-dash')"><span class="step-no">현황</span><b>기수 현황판 · 랭킹</b><span class="hint">완료 유닛 기준</span><span class="arrow">▼</span></div>
        <div class="card-b">
          <select id="dashSel" onchange="loadDashboard()" style="width:100%;border:1.5px solid #cfe0ea;border-radius:10px;padding:9px 11px;font-size:13.5px;background:#fff;font-family:'Noto Sans KR';margin-bottom:12px"></select>
          <div id="dashBody"><div class="empty">기수를 선택해 주세요</div></div>
        </div>
      </div>

      <div class="card folded" id="card-acct">
        <div class="card-h" onclick="toggleCard('card-acct')"><span class="step-no">NEW</span><b>새 계정 만들기</b><span class="hint" id="acctHint"></span><span class="arrow">▼</span></div>
        <div class="card-b">
          <div class="roletabs" id="roleTabs" style="display:none">
            <button class="roletab on" id="tabStudent" onclick="setAcctRole('student')">👤 학생 계정</button>
            <button class="roletab" id="tabAdmin" onclick="setAcctRole('admin')">🛡️ 관리자 계정</button>
          </div>

          <div class="form" id="studentForm">
            <input id="na-name" placeholder="학생 이름">
            <input id="na-id" placeholder="아이디">
            <input id="na-pw" type="password" placeholder="초기 비밀번호">
            <div class="row2">
              <label>이용 만료일</label>
              <input id="na-exp" type="date">
            </div>
            <div class="hintline">닉네임은 학생이 로그인 후 직접 설정해요 (초기값은 이름과 동일).</div>
            <button class="pbtn" id="na-btn" onclick="createStudent()">➕ 학생 계정 생성</button>
          </div>

          <div class="form" id="adminForm" style="display:none">
            <input id="na2-name" placeholder="관리자 이름">
            <input id="na2-id" placeholder="아이디">
            <input id="na2-pw" type="password" placeholder="초기 비밀번호">
            <select id="na2-role">
              <option value="general">일반관리자</option>
              <option value="super">최고관리자</option>
            </select>
            <div class="hintline">최고관리자는 관리자 계정 생성 등 모든 권한을 가져요.</div>
            <button class="pbtn" id="na2-btn" onclick="createAdminAcct()">➕ 관리자 계정 생성</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const SUPA_URL="https://axwkoviaxacxkbxtouwh.supabase.co";
const SUPA_KEY="sb_publishable_lQCcI5UMHOlVfL8yunPc9Q_lJZSiBhY";

async function rpc(name, params){
  const r=await fetch(SUPA_URL+"/rest/v1/rpc/"+name,{
    method:"POST",
    headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(params||{})
  });
  const t=await r.text();
  if(!r.ok) throw new Error(t||("HTTP "+r.status));
  return t?JSON.parse(t):null;
}

const AKEY="engtoon_challenge_admin";
let me=null;
let acctRole="student";

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove("show"),2400);
}

function defaultExpiry(){
  const d=new Date(); d.setDate(d.getDate()+130); /* 대략 챌린지 100일 + 졸업생 30일 */
  return d.toISOString().slice(0,10);
}

function showMain(){
  document.getElementById("loginScr").style.display="none";
  document.getElementById("mainScr").style.display="block";
  document.getElementById("roleBadge").textContent=me.role==="super"?"👑 최고관리자":"일반관리자";
  const isSuper=me.role==="super";
  document.getElementById("roleTabs").style.display=isSuper?"flex":"none";
  document.getElementById("acctHint").textContent=isSuper?"학생·관리자 모두 생성 가능":"학생 계정만 생성 가능";
  document.getElementById("na-exp").value=defaultExpiry();
  document.getElementById("btnNewCohort").style.display=isSuper?"inline-block":"none";
  document.getElementById("co-start").value=new Date().toISOString().slice(0,10);
  loadCohorts();
  loadQnaAdmin();
}

function toggleCard(id){
  document.getElementById(id).classList.toggle("folded");
}

async function doLogin(){
  const id=document.getElementById("lg-id").value.trim();
  const pw=document.getElementById("lg-pw").value;
  const err=document.getElementById("lg-err");
  err.classList.remove("show");
  if(!id||!pw){err.textContent="아이디와 비밀번호를 입력해 주세요";err.classList.add("show");return;}
  const btn=document.getElementById("lg-btn");
  btn.disabled=true;btn.textContent="확인 중...";
  try{
    const rows=await rpc("admin_login",{p_login_id:id,p_pw:pw});
    if(!rows||!rows.length){
      err.textContent="아이디 또는 비밀번호가 올바르지 않아요";
      err.classList.add("show");
    }else{
      me=rows[0];
      localStorage.setItem(AKEY,JSON.stringify(me));
      showMain();
    }
  }catch(e){
    err.textContent="서버 연결에 실패했어요. 잠시 후 다시 시도해 주세요";
    err.classList.add("show");
  }
  btn.disabled=false;btn.textContent="로그인";
}

function doLogout(){
  me=null;
  localStorage.removeItem(AKEY);
  document.getElementById("mainScr").style.display="none";
  document.getElementById("loginScr").style.display="flex";
  document.getElementById("lg-id").value="";
  document.getElementById("lg-pw").value="";
}

function setAcctRole(r){
  acctRole=r;
  document.getElementById("tabStudent").classList.toggle("on",r==="student");
  document.getElementById("tabAdmin").classList.toggle("on",r==="admin");
  document.getElementById("studentForm").style.display=r==="student"?"flex":"none";
  document.getElementById("adminForm").style.display=r==="admin"?"flex":"none";
}

async function createStudent(){
  const name=document.getElementById("na-name").value.trim();
  const id=document.getElementById("na-id").value.trim();
  const pw=document.getElementById("na-pw").value;
  const exp=document.getElementById("na-exp").value;
  if(!name||!id||!pw||!exp){toast("이름·아이디·비밀번호·만료일을 모두 입력해 주세요");return;}
  const btn=document.getElementById("na-btn");
  btn.disabled=true;
  try{
    await rpc("create_student",{p_login_id:id,p_pw:pw,p_name:name,p_expires:exp});
    toast(name+" 학생 계정 생성 완료 · 만료일 "+exp);
    document.getElementById("na-name").value="";
    document.getElementById("na-id").value="";
    document.getElementById("na-pw").value="";
    loadCohorts(true);
  }catch(e){
    toast(e.message.includes("duplicate")?"이미 사용 중인 아이디예요":"생성 실패: 잠시 후 다시 시도해 주세요");
  }
  btn.disabled=false;
}

async function createAdminAcct(){
  if(!me||me.role!=="super"){toast("최고관리자만 가능해요");return;}
  const name=document.getElementById("na2-name").value.trim();
  const id=document.getElementById("na2-id").value.trim();
  const pw=document.getElementById("na2-pw").value;
  const role=document.getElementById("na2-role").value;
  if(!name||!id||!pw){toast("이름·아이디·비밀번호를 모두 입력해 주세요");return;}
  const btn=document.getElementById("na2-btn");
  btn.disabled=true;
  try{
    await rpc("create_admin",{p_login_id:id,p_pw:pw,p_name:name,p_role:role});
    toast(name+"님 "+(role==="super"?"최고관리자":"일반관리자")+" 계정 생성 완료");
    document.getElementById("na2-name").value="";
    document.getElementById("na2-id").value="";
    document.getElementById("na2-pw").value="";
  }catch(e){
    toast(e.message.includes("duplicate")?"이미 사용 중인 아이디예요":"생성 실패: 잠시 후 다시 시도해 주세요");
  }
  btn.disabled=false;
}

/* ================= Q&A 관리 ================= */
let QNA_ALL=[];
let qnaAdminTab='wait';

function setQnaAdminTab(t){
  qnaAdminTab=t;
  document.getElementById('qtabWait').classList.toggle('on',t==='wait');
  document.getElementById('qtabDone').classList.toggle('on',t==='done');
  renderQnaAdmin();
}

async function loadQnaAdmin(){
  try{
    QNA_ALL=await rpc("list_qna_admin",{p_challenge_id:1})||[];
  }catch(e){QNA_ALL=[];}
  renderQnaAdmin();
}

function escQ(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtD(ts){return ts?String(ts).slice(0,10):"";}

function renderQnaAdmin(){
  const waitN=QNA_ALL.filter(q=>!q.answer).length;
  document.getElementById("qnaCount").textContent=waitN?`미답변 ${waitN}건`:"모두 답변 완료 🎉";
  document.getElementById("qtabWait").textContent=`⏳ 미답변 ${waitN?`(${waitN})`:''}`;
  const rows=QNA_ALL.filter(q=>qnaAdminTab==='wait'?!q.answer:!!q.answer);
  const box=document.getElementById("qnaList");
  if(!rows.length){
    box.innerHTML=`<div class="empty">${qnaAdminTab==='wait'?'미답변 질문이 없어요 🎉':'아직 답변한 질문이 없어요'}</div>`;
    return;
  }
  box.innerHTML=rows.map(q=>{
    /* 답변중 잠금 표시 (미답변만) */
    let claimHtml='';
    if(!q.answer){
      if(q.claimed_by&&q.claimed_by!==me.name){
        claimHtml=`<div style="display:flex;align-items:center;gap:7px;margin-bottom:8px">
          <span class="claim-badge">✍️ ${escQ(q.claimed_by)} 선생님이 답변 작성 중</span>
          <button class="co-btn" style="font-size:10px;padding:3px 8px" onclick="releaseClaim(${q.id})">잠금 해제</button>
        </div>`;
      }else if(q.claimed_by===me.name){
        claimHtml=`<div style="display:flex;align-items:center;gap:7px;margin-bottom:8px">
          <span class="claim-badge mine">✍️ 내가 답변 작성 중</span>
          <button class="co-btn" style="font-size:10px;padding:3px 8px" onclick="releaseClaim(${q.id})">작성 취소</button>
        </div>`;
      }else{
        claimHtml=`<button class="co-btn" style="margin-bottom:8px" onclick="claimQna(${q.id})">✍️ 답변 시작 — 다른 선생님에게 "작성 중" 표시</button>`;
      }
    }
    return `
    <div style="border:1.5px solid #e3edf3;border-radius:11px;padding:11px 12px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--sky-deep);margin-bottom:5px">
        <span>${escQ(q.student_name)}</span>
        <span>· UNIT ${q.unit_no}${q.expr_title?' · '+escQ(q.expr_title):''}</span>
        ${q.is_private?'<span>🔒비공개</span>':''}
        ${q.is_best?'<span>⭐베스트</span>':''}
        <span style="margin-left:auto;color:#7b93a4;font-weight:700">${fmtD(q.created_at)}</span>
      </div>
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">Q. ${escQ(q.question)}</div>
      ${claimHtml}
      <textarea id="ans-${q.id}" placeholder="답변을 입력하세요" style="width:100%;border:1.5px solid #cfe0ea;border-radius:9px;padding:9px 11px;font-size:13px;min-height:60px;resize:vertical;font-family:'Noto Sans KR'">${escQ(q.answer||'')}</textarea>
      <div style="display:flex;gap:7px;margin-top:8px">
        <button class="pbtn" style="flex:1;font-size:12.5px;padding:8px" onclick="saveAnswer(${q.id})">${q.answer?'✏️ 답변 수정':'✅ 답변 등록'}</button>
        ${q.answer&&!q.is_private?`<button class="pbtn" style="flex:1;font-size:12.5px;padding:8px;background:${q.is_best?'#fff':'var(--sun)'};color:var(--ink);text-shadow:none" onclick="setBest(${q.id},${!q.is_best})">${q.is_best?'⭐ 베스트 해제':'⭐ 베스트 지정'}</button>`:''}
      </div>
    </div>`;
  }).join("");
}

async function claimQna(id){
  try{
    const who=await rpc("claim_qna",{p_qna_id:id,p_admin_name:me.name});
    if(who&&who!==me.name){
      toast(`앗, ${who} 선생님이 먼저 작성을 시작했어요`);
    }else{
      toast('"작성 중"으로 표시했어요. 다른 선생님 화면에도 보여요');
    }
    await loadQnaAdmin();
  }catch(e){toast("표시 실패: 7단계B SQL이 실행됐는지 확인해 주세요");}
}

async function releaseClaim(id){
  try{
    await rpc("release_qna",{p_qna_id:id});
    toast("잠금을 해제했어요");
    await loadQnaAdmin();
  }catch(e){toast("해제 실패: 잠시 후 다시 시도해 주세요");}
}

async function saveAnswer(id){
  const v=document.getElementById("ans-"+id).value.trim();
  if(!v){toast("답변을 입력해 주세요");return;}
  try{
    await rpc("answer_qna",{p_qna_id:id,p_answer:v});
    toast("답변이 저장됐어요");
    await loadQnaAdmin();
  }catch(e){toast("저장 실패: 잠시 후 다시 시도해 주세요");}
}

async function setBest(id,best){
  try{
    await rpc("toggle_qna_best",{p_qna_id:id,p_best:best});
    toast(best?"⭐ 베스트로 지정했어요 (학생 앱에 상단 노출)":"베스트를 해제했어요");
    await loadQnaAdmin();
  }catch(e){toast("변경 실패: 잠시 후 다시 시도해 주세요");}
}

/* ================= 기수 관리 ================= */
let COHORTS=[];
let assignMode=false; /* 미배정 학생 배정 화면 여부 */

function dEsc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function dday(exp){
  const t=new Date();t.setHours(0,0,0,0);
  const d=Math.round((new Date(exp+"T00:00:00")-t)/86400000);
  return d<0?"만료":"D-"+d;
}

async function loadCohorts(keepSel){
  try{COHORTS=await rpc("list_cohorts",{})||[];}catch(e){COHORTS=[];}
  const sel=document.getElementById("cohortSel");
  const prev=keepSel?sel.value:null;
  const opts=['<option value="">— 기수 선택 —</option>']
    .concat(COHORTS.map(c=>`<option value="${c.id}">${dEsc(c.name)} · ${dEsc(c.challenge_name)} (${c.student_count}명)</option>`))
    .concat(['<option value="un">📥 미배정 학생 보기</option>']);
  sel.innerHTML=opts.join("");
  if(prev)sel.value=prev;
  document.getElementById("cohortHint").textContent=COHORTS.length+"개 기수";
  /* 현황판 select도 동기화 */
  const ds=document.getElementById("dashSel");
  const dprev=keepSel?ds.value:null;
  ds.innerHTML=['<option value="">— 기수 선택 —</option>']
    .concat(COHORTS.map(c=>`<option value="${c.id}">${dEsc(c.name)} · ${dEsc(c.challenge_name)}</option>`)).join("");
  if(dprev)ds.value=dprev;
  if(!assignMode)onCohortChange(); /* 배정 화면 중에는 목록으로 튕기지 않게 */
}

function toggleNewCohortForm(){
  const f=document.getElementById("cohortNewForm");
  f.style.display=f.style.display==="none"?"block":"none";
}

async function createCohort(){
  if(!me||me.role!=="super"){toast("최고관리자만 가능해요");return;}
  const name=document.getElementById("co-name").value.trim();
  const ch=parseInt(document.getElementById("co-ch").value);
  const start=document.getElementById("co-start").value;
  if(!name||!start){toast("기수 이름과 시작일을 입력해 주세요");return;}
  try{
    await rpc("create_cohort",{p_challenge_id:ch,p_name:name,p_start:start});
    toast(`${name} 기수를 만들었어요`);
    document.getElementById("co-name").value="";
    toggleNewCohortForm();
    await loadCohorts();
  }catch(e){toast("생성 실패: 잠시 후 다시 시도해 주세요");}
}

async function onCohortChange(){
  assignMode=false;
  const v=document.getElementById("cohortSel").value;
  const box=document.getElementById("cohortBody");
  if(!v){box.innerHTML='<div class="empty">기수를 선택해 주세요</div>';return;}
  box.innerHTML='<div class="empty">불러오는 중...</div>';
  const isSuper=me&&me.role==="super";
  try{
    if(v==="un"){
      const rows=await rpc("get_unassigned_students",{})||[];
      box.innerHTML=(rows.length?rows.map(s=>`
        <div class="co-row">
          <span class="co-name">${dEsc(s.name)}</span>
          <span class="co-sub">@${dEsc(s.login_id)} · ${dday(s.expires_at)}</span>
        </div>`).join("")
      :'<div class="empty">미배정 학생이 없어요 🎉</div>')
      +'<div class="hintline" style="margin-top:10px">배정하려면 위에서 기수를 선택한 뒤 "➕ 학생 배정"을 눌러 주세요.</div>';
      return;
    }
    const rows=await rpc("get_cohort_students",{p_cohort_id:parseInt(v)})||[];
    const list=rows.length?rows.map(s=>`
      <div class="co-row">
        <span class="co-name">${dEsc(s.name)}</span>
        <span class="co-sub">@${dEsc(s.login_id)}${s.nickname&&s.nickname!==s.name?" · "+dEsc(s.nickname):""} · ${dday(s.expires_at)}</span>
        ${isSuper?`<button class="co-btn del" onclick="unassign(${v},${s.id},'${dEsc(s.name)}')">✖ 제외</button>`:''}
      </div>`).join("")
    :'<div class="empty">아직 배정된 학생이 없어요</div>';
    box.innerHTML=list+(isSuper?`<button class="pbtn" style="width:100%;margin-top:12px" onclick="openAssign(${v})">➕ 학생 배정</button>`:'');
  }catch(e){
    box.innerHTML='<div class="empty">불러오지 못했어요 (7단계B SQL이 실행됐는지 확인해 주세요)</div>';
  }
}

async function openAssign(cohortId){
  assignMode=true;
  const box=document.getElementById("cohortBody");
  box.innerHTML='<div class="empty">불러오는 중...</div>';
  try{
    const rows=await rpc("get_unassigned_students",{})||[];
    box.innerHTML=`
      <div style="font-family:'Jua';font-size:13px;margin-bottom:9px">📥 미배정 학생 (${rows.length}명) — 배정 버튼을 눌러 추가하세요</div>
      ${rows.length?rows.map(s=>`
      <div class="co-row" id="assign-${s.id}">
        <span class="co-name">${dEsc(s.name)}</span>
        <span class="co-sub">@${dEsc(s.login_id)}</span>
        <button class="co-btn add" onclick="assign(${cohortId},${s.id},'${dEsc(s.name)}')">배정</button>
      </div>`).join("")
      :'<div class="empty">미배정 학생이 없어요. 새 계정을 먼저 만들어 주세요.</div>'}
      <button class="co-btn" style="width:100%;margin-top:12px;text-align:center" onclick="onCohortChange()">‹ 기수 목록으로</button>`;
  }catch(e){box.innerHTML='<div class="empty">불러오지 못했어요</div>';}
}

async function assign(cohortId,studentId,name){
  try{
    await rpc("enroll_student",{p_cohort_id:cohortId,p_student_id:studentId});
    toast(`${name} 학생을 배정했어요`);
    const row=document.getElementById("assign-"+studentId);
    if(row)row.remove();
    await loadCohorts(true);
  }catch(e){toast("배정 실패: 잠시 후 다시 시도해 주세요");}
}

async function unassign(cohortId,studentId,name){
  try{
    await rpc("unenroll_student",{p_cohort_id:cohortId,p_student_id:studentId});
    toast(`${name} 학생을 기수에서 제외했어요 (계정·기록은 유지)`);
    await loadCohorts(true);
  }catch(e){toast("제외 실패: 잠시 후 다시 시도해 주세요");}
}

/* ================= 기수 현황판 ================= */
async function loadDashboard(){
  const v=document.getElementById("dashSel").value;
  const box=document.getElementById("dashBody");
  if(!v){box.innerHTML='<div class="empty">기수를 선택해 주세요</div>';return;}
  box.innerHTML='<div class="empty">집계 중...</div>';
  try{
    const rows=await rpc("cohort_dashboard",{p_cohort_id:parseInt(v)})||[];
    if(!rows.length){box.innerHTML='<div class="empty">이 기수에 배정된 학생이 없어요</div>';return;}
    box.innerHTML=rows.map((r,i)=>{
      const rank=i<3?['🥇','🥈','🥉'][i]:(i+1);
      const last=r.last_active?String(r.last_active).slice(5,10).replace('-','/'):'—';
      return `<div class="dash-row">
        <span class="dash-rank">${rank}</span>
        <span class="dash-name">${dEsc(r.name)}${r.nickname&&r.nickname!==r.name?` <span style="font-weight:400;color:#7b93a4;font-size:10.5px">(${dEsc(r.nickname)})</span>`:''}</span>
        <span class="dash-stat">📗 ${r.units_done}유닛</span>
        <span class="dash-stat">📖 ${r.exprs_done}</span>
        <span class="dash-stat">🧩 ${r.quiz_count}</span>
        <span class="dash-last">${last}</span>
      </div>`;
    }).join("")+'<div class="hintline" style="margin-top:10px">순위는 완료 유닛 기준 · 📖 완료 표현 수 · 🧩 퀴즈 풀이 횟수 · 마지막은 최근 학습일</div>';
  }catch(e){box.innerHTML='<div class="empty">불러오지 못했어요 (7단계B SQL이 실행됐는지 확인해 주세요)</div>';}
}

  const saved=localStorage.getItem(AKEY);
  if(saved){try{me=JSON.parse(saved);showMain();}catch(e){localStorage.removeItem(AKEY);}}
})();

document.getElementById("lg-pw").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
