<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잉툰 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Nunito:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E3A4F; --sky:#47AEE4; --sky-deep:#2E90C8; --sky-soft:#E3F3FC;
  --paper:#FBFBF4; --card:#FFFFFF; --sun:#FFD34D; --coral:#FF7B6B; --green:#2FBF87;
  --line:2.5px solid var(--ink); --pop:4px 4px 0 var(--ink); --pop-sm:3px 3px 0 var(--ink); --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--sky-soft);
  background-image:radial-gradient(#c9e6f7 1.5px, transparent 1.5px);background-size:22px 22px;
  min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:430px;background:var(--paper);min-height:100vh;border-left:var(--line);border-right:var(--line);position:relative}
section[hidden]{display:none!important}

/* ---------- 로그인 ---------- */
#scr-login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;background:var(--sky);background-image:radial-gradient(#7cc7ee 2px, transparent 2px);background-size:26px 26px}
.lg-wrap{text-align:center;margin-bottom:26px}
.lg-face{width:84px;height:84px;margin:0 auto 12px;border:3px solid var(--ink);border-radius:50%;background:#fff;box-shadow:5px 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-size:40px}
.lg-title{font-family:'Jua';font-size:27px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.lg-sub{margin-top:6px;font-size:12.5px;font-weight:700;color:#eaf6fd}
.lg-card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:var(--pop);padding:22px 18px}
.lg-card label{display:block;font-family:'Jua';font-size:13px;margin:2px 0 6px}
.lg-card input{width:100%;border:2px solid var(--ink);border-radius:10px;padding:12px;font-size:15px;background:#fff;margin-bottom:14px}
.lg-btn{width:100%;font-family:'Jua';font-size:16px;background:var(--sky);color:#fff;text-shadow:1px 1px 0 var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:12px;cursor:pointer;box-shadow:var(--pop)}
.lg-btn:disabled{opacity:.6}
.lg-err{font-size:12px;color:var(--coral);font-weight:700;text-align:center;margin-top:10px;display:none}
.lg-err.show{display:block}

/* ---------- 공통 ---------- */
.topbar{background:var(--sky);border-bottom:var(--line);padding:12px 14px 10px;position:sticky;top:0;z-index:20}
.topbar .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:'Jua';font-size:17px;color:#fff;text-shadow:1.5px 1.5px 0 var(--ink)}
.backbtn{background:rgba(255,255,255,.92);border:2px solid var(--ink);border-radius:9px;font-family:'Jua';font-size:12px;padding:5px 10px;cursor:pointer;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.logoutbtn{background:rgba(255,255,255,.92);border:2px solid var(--ink);border-radius:9px;font-size:11px;font-weight:800;padding:5px 10px;cursor:pointer;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.stage{padding:16px;padding-bottom:40px}
.card{background:var(--card);border:var(--line);border-radius:var(--r);box-shadow:var(--pop);margin-bottom:16px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:var(--line);background:var(--sky-soft)}
.card-h b{font-family:'Jua';font-size:15px;font-weight:400}
.card-b{padding:14px;font-size:13.5px;line-height:1.7}
.bigbtn{display:block;width:100%;font-family:'Jua';font-size:15.5px;background:var(--sun);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:13px;cursor:pointer;box-shadow:var(--pop);text-align:center}
.bigbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.mini{font-family:'Jua';font-size:13px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;box-shadow:var(--pop-sm);color:var(--ink)}
.mini:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.mini.y{background:var(--sun)}
.mini.g{background:var(--green);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.mini:disabled{opacity:.5}
.toastRoot{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:9px 18px;z-index:80;display:none;max-width:86%;text-align:center}
.toastRoot.show{display:block}
.loading{text-align:center;padding:34px 0;font-family:'Jua';font-size:14px;color:#7b93a4}

/* ---------- 홈 ---------- */
.hello{font-family:'Jua';font-size:19px;margin-bottom:3px}
.hello-sub{font-size:12px;color:#5a7285}
.expbanner{background:#FFF3F1;border:var(--line);border-radius:var(--r);box-shadow:var(--pop);padding:14px;margin-bottom:16px}
.expbanner .t{font-family:'Jua';font-size:15px;color:var(--coral);margin-bottom:4px}
.expbanner .d{font-size:12.5px;line-height:1.6}
.today-unit{font-family:'Jua';font-size:22px;color:var(--sky-deep);margin-bottom:2px}
.today-sub{font-size:12px;color:#5a7285;margin-bottom:12px}
.sumrow{display:flex;gap:9px;margin-bottom:16px}
.sumtile{flex:1;background:var(--card);border:var(--line);border-radius:12px;box-shadow:var(--pop-sm);padding:11px 8px;text-align:center}
.sumtile .v{font-family:'Jua';font-size:18px;color:var(--sky-deep)}
.sumtile .k{font-size:10.5px;font-weight:700;color:#7b93a4;margin-top:2px}

/* ---------- 유닛 목록 ---------- */
.ugrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ucell{aspect-ratio:1;border:2px solid var(--ink);border-radius:11px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Nunito';font-weight:800;font-size:14px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.ucell span{font-size:9px;font-family:'Jua';font-weight:400;margin-top:1px}
.ucell.done{background:var(--green);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.ucell.part{background:var(--sun)}
.ucell.next{background:var(--sky);color:#fff;text-shadow:1px 1px 0 var(--ink);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ucell.locked{background:#f0f4f6;color:#c2ced6;box-shadow:none;border-color:#dbe4ea;cursor:default}
.ucell.open{background:#fff;border:2px dashed var(--sky-deep);color:var(--sky-deep)}
.ulegend{font-size:11px;color:#7b93a4;margin-top:12px;line-height:1.7}

/* ---------- 학습 화면 ---------- */
.pills{display:flex;gap:7px;margin-bottom:14px}
.pill{flex:1;text-align:center;font-family:'Jua';font-size:13px;border:2px solid var(--ink);border-radius:999px;background:#fff;padding:7px 0;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.pill.on{background:var(--sky);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.pill.ok{background:var(--green);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.exp-title{font-family:'Nunito';font-weight:800;font-size:21px}
.exp-mean{font-family:'Jua';font-size:14px;color:var(--sky-deep);margin:2px 0 8px}
.exp-desc{font-size:12.5px;line-height:1.75;color:#40607a;background:var(--sky-soft);border-radius:10px;padding:10px 12px}
.steplbl{display:inline-block;font-family:'Jua';font-size:12px;background:var(--ink);color:#fff;border-radius:8px;padding:2px 10px;margin-bottom:8px}
.sent{font-family:'Nunito';font-weight:800;font-size:17px;line-height:1.5}
.sent-ko{font-size:12.5px;color:#5a7285;margin-top:3px}
.speakrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.cntbar{flex:1;height:12px;background:#eef2f5;border-radius:999px;overflow:hidden;border:1.5px solid #dbe4ea}
.cntbar>i{display:block;height:100%;background:var(--sky);border-radius:999px;transition:width .25s}
.cntnum{font-family:'Jua';font-size:13px;min-width:40px;text-align:right}
.copyrow{display:flex;gap:8px;margin-top:10px}
.copyrow input{flex:1;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;font-family:'Nunito';min-width:0}
.copychecks{display:flex;gap:6px;margin-top:4px}
.cc{width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff}
.cc.on{background:var(--green);color:#fff}
.copyfb{font-size:11.5px;font-weight:700;margin-top:7px}
.prac{border:2px solid var(--ink);border-radius:12px;background:#fff;box-shadow:var(--pop-sm);padding:12px;margin-bottom:12px}
.prac-q{font-size:13.5px;font-weight:700;margin-bottom:8px}
.prac textarea{width:100%;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;font-family:'Nunito';resize:vertical;min-height:44px}
.prac-hintbtn{font-size:11px;font-weight:800;color:var(--sky-deep);background:var(--sky-soft);border:none;border-radius:999px;padding:4px 11px;cursor:pointer;margin-bottom:8px}
.prac-hint{font-size:12px;color:#5a7285;background:var(--sky-soft);border-radius:9px;padding:7px 11px;margin-bottom:8px;display:none}
.prac-hint.show{display:block}
.prac-btns{display:flex;gap:8px;margin-top:9px}
.model{margin-top:10px;background:#FFF9E3;border:2px dashed var(--sun);border-radius:10px;padding:10px 12px}
.model .ml{font-family:'Jua';font-size:11.5px;color:#B8860B;margin-bottom:4px}
.model .ma{font-family:'Nunito';font-weight:800;font-size:14px;line-height:1.5}
.model .mine{font-size:12px;color:#5a7285;margin-top:2px;line-height:1.5;word-break:break-word}
.donetag{display:inline-block;font-size:11px;font-weight:800;background:#E4F8EF;color:var(--green);border:1.5px solid var(--green);border-radius:999px;padding:2px 10px}
.tagpill{display:inline-block;font-size:10px;font-weight:800;background:var(--sky-deep);color:#fff;border-radius:6px;padding:2px 7px;margin-right:5px}
.navbtns{display:flex;gap:9px;margin-top:4px}
.navbtns .mini{flex:1;text-align:center}

/* ---------- 메달 ---------- */
.mcat{font-family:'Jua';font-size:14px;margin:18px 0 9px}
.mcat:first-child{margin-top:0}
.mcat .mc-cnt{font-family:'Nunito';font-weight:800;font-size:11.5px;color:#7b93a4;margin-left:6px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.medal{border:2px solid var(--ink);border-radius:12px;background:#fff;box-shadow:2px 2px 0 var(--ink);padding:9px 4px;text-align:center}
.medal .mi{font-size:22px}
.medal .mn{font-family:'Jua';font-size:9.5px;margin-top:3px;line-height:1.3}
.medal.locked{background:#f3f6f8;box-shadow:none;border-color:#dbe4ea}
.medal.locked .mi{filter:grayscale(1);opacity:.4}
.medal.locked .mn{color:#b9c6d0}
.medal.new{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.msum{background:linear-gradient(135deg,var(--sky),var(--sun));border:var(--line);border-radius:var(--r);box-shadow:var(--pop);padding:14px;margin-bottom:6px;color:#1e3a4f}
.msum .mt{font-family:'Jua';font-size:16px}
.msum .md{font-size:12px;font-weight:700;margin-top:2px}

/* ---------- 복습 퀴즈 ---------- */
.qz-bar{height:10px;background:#eef2f5;border-radius:999px;overflow:hidden;border:1.5px solid #dbe4ea;margin-bottom:14px}
.qz-bar>i{display:block;height:100%;background:var(--sky);border-radius:999px;transition:width .3s}
.qz-kicker{display:inline-block;font-family:'Jua';font-size:11.5px;background:var(--ink);color:#fff;border-radius:8px;padding:2px 10px;margin-bottom:9px}
.qz-q{font-size:15.5px;font-weight:700;line-height:1.6;margin-bottom:4px}
.qz-q .en{font-family:'Nunito';font-weight:800;font-size:19px}
.qz-sub{font-size:12px;color:#7b93a4;margin-bottom:11px}
.qz-opt{display:block;width:100%;text-align:left;border:2px solid var(--ink);border-radius:11px;background:#fff;box-shadow:var(--pop-sm);padding:11px 13px;font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:9px;color:var(--ink);font-family:'Noto Sans KR'}
.qz-opt:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.qz-opt.right{background:var(--green);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.qz-opt.wrong{background:var(--coral);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.qz-opt:disabled{opacity:.92}
.qz-fb{border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.65;margin-top:4px;font-weight:700}
.qz-fb.good{background:#E4F8EF;color:#177a52}
.qz-fb.bad{background:#FFEDEA;color:#c0392b}
.qz-input{display:flex;gap:8px}
.qz-input input{flex:1;border:2px solid var(--ink);border-radius:10px;padding:11px 12px;font-size:14px;font-family:'Nunito';min-width:0}
.qz-words{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
.qz-word{font-family:'Nunito';font-weight:800;font-size:13.5px;border:2px solid var(--ink);border-radius:9px;background:#fff;box-shadow:2px 2px 0 var(--ink);padding:7px 11px;cursor:pointer;color:var(--ink)}
.qz-word.used{opacity:.28;pointer-events:none}
.qz-built{min-height:44px;border:2px dashed var(--sky-deep);border-radius:11px;background:var(--sky-soft);padding:9px 11px;font-family:'Nunito';font-weight:800;font-size:14px;margin-bottom:9px;line-height:1.6}
.qz-nextwrap{margin-top:12px}
.qz-result{text-align:center;padding:8px 0 4px}
.qz-result .em{font-size:50px}
.qz-result h2{font-family:'Jua';font-size:21px;margin:6px 0 2px}
.qz-result .sc{font-family:'Nunito';font-weight:800;font-size:30px;color:var(--sky-deep)}
.qz-result p{font-size:12.5px;color:#5a7285;line-height:1.7;margin:6px 0 14px}
.qz-wrongitem{border:2px solid var(--ink);border-radius:11px;background:#fff;box-shadow:var(--pop-sm);padding:11px 13px;margin-bottom:10px;font-size:12.5px;line-height:1.65;text-align:left}
.qz-wrongitem .we{font-family:'Nunito';font-weight:800;font-size:14px;color:var(--sky-deep)}

/* ---------- 주차 현황 ---------- */
.wk-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wk-nav button{font-family:'Jua';font-size:16px;background:#fff;border:2px solid var(--ink);border-radius:10px;width:38px;height:38px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.wk-nav button:disabled{opacity:.35;cursor:default}
.wk-title{flex:1;text-align:center;font-family:'Jua';font-size:15px}
.wk-mytiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px}
.wk-mc{aspect-ratio:1;border:2px solid var(--ink);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Nunito';font-weight:800;font-size:12.5px}
.wk-mc span{font-size:8.5px;font-family:'Jua';font-weight:400;margin-top:1px}
.wk-mc.done{background:var(--green);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.wk-mc.part{background:var(--sun)}
.wk-mc.locked{background:#f0f4f6;color:#c2ced6;border-color:#dbe4ea}
.wk-mc.open{background:#fff;border:2px dashed var(--sky-deep);color:var(--sky-deep)}
.wk-roster-row{display:flex;align-items:center;gap:6px;padding:8px 4px;border-bottom:1.5px solid #eef2f5}
.wk-roster-row.me{background:var(--sky-soft);border-radius:9px}
.wk-rname{width:64px;font-family:'Jua';font-size:11px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-rchips{display:flex;gap:4px;flex:1}
.wk-chip{flex:1;aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;font-family:'Nunito'}
.wk-chip.d{background:var(--green);color:#fff}
.wk-chip.p{background:var(--sun);color:var(--ink)}
.wk-chip.z{background:#eef2f5;color:#c2ced6}

/* ---------- 유닛 완료 오버레이 ---------- */
.veil{position:fixed;inset:0;background:rgba(30,58,79,.72);z-index:60;display:none;align-items:center;justify-content:center;padding:28px}
.veil.show{display:flex}
.vmodal{width:100%;max-width:360px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 rgba(0,0,0,.3);padding:26px 20px;text-align:center}
.vmodal .em{font-size:52px}
.vmodal h2{font-family:'Jua';font-size:21px;margin:8px 0 4px}
.vmodal p{font-size:13px;color:#5a7285;line-height:1.7;margin-bottom:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- 로그인 -->
  <section id="scr-login">
    <div class="lg-wrap">
      <div class="lg-face">😊</div>
      <div class="lg-title">잉툰 챌린지</div>
      <div class="lg-sub">매일 5개 표현, 100일의 습관</div>
    </div>
    <div class="lg-card">
      <label>아이디</label>
      <input id="lg-id" placeholder="아이디" autocomplete="username">
      <label>비밀번호</label>
      <input id="lg-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button class="lg-btn" id="lg-btn" onclick="doLogin()">시작하기 ▶</button>
      <div class="lg-err" id="lg-err"></div>
    </div>
  </section>

  <!-- 홈 -->
  <section id="scr-home" hidden>
    <div class="topbar">
      <div class="row">
        <div class="brand">잉툰 챌린지</div>
        <button class="backbtn" onclick="openSettings()" style="margin-right:6px">⚙️ 설정</button>
        <button class="logoutbtn" onclick="doLogout()">로그아웃</button>
      </div>
    </div>
    <div class="stage" id="homeStage"><div class="loading">불러오는 중...</div></div>
  </section>

  <!-- 유닛 목록 -->
  <section id="scr-units" hidden>
    <div class="topbar">
      <div class="row">
        <button class="backbtn" onclick="show('home')">‹ 홈</button>
        <div class="brand">📚 유닛 목록</div>
        <span style="width:52px"></span>
      </div>
    </div>
    <div class="stage" id="unitsStage"><div class="loading">불러오는 중...</div></div>
  </section>

  <!-- 학습 -->
  <section id="scr-study" hidden>
    <div class="topbar">
      <div class="row">
        <button class="backbtn" onclick="leaveStudy()">‹ 나가기</button>
        <div class="brand" id="studyTitle">UNIT</div>
        <span style="width:52px"></span>
      </div>
    </div>
    <div class="stage" id="studyStage"><div class="loading">불러오는 중...</div></div>
  </section>

  <!-- 메달 -->
  <section id="scr-medals" hidden>
    <div class="topbar">
      <div class="row">
        <button class="backbtn" onclick="show('home')">‹ 홈</button>
        <div class="brand">🏅 내 메달</div>
        <span style="width:52px"></span>
      </div>
    </div>
    <div class="stage" id="medalStage"><div class="loading">불러오는 중...</div></div>
  </section>

  <!-- 복습 퀴즈 -->
  <section id="scr-quiz" hidden>
    <div class="topbar">
      <div class="row">
        <button class="backbtn" onclick="quitQuiz()">‹ 나가기</button>
        <div class="brand">🧩 복습 퀴즈</div>
        <div class="brand" id="quizBadge" style="font-size:13px">0/13</div>
      </div>
    </div>
    <div class="stage" id="quizStage"><div class="loading">불러오는 중...</div></div>
  </section>

  <!-- Q&A -->
  <section id="scr-qna" hidden>
    <div class="topbar">
      <div class="row">
        <button class="backbtn" onclick="enterHome()">‹ 홈</button>
        <div class="brand">💬 Q&amp;A</div>
        <span style="width:52px"></span>
      </div>
    </div>
    <div class="stage" id="qnaStage"><div class="loading">불러오는 중...</div></div>
  </section>

  <!-- 설정 -->
  <section id="scr-settings" hidden>
    <div class="topbar">
      <div class="row">
        <button class="backbtn" onclick="enterHome()">‹ 홈</button>

<script>
const SUPA_URL="https://axwkoviaxacxkbxtouwh.supabase.co";
const SUPA_KEY="sb_publishable_lQCcI5UMHOlVfL8yunPc9Q_lJZSiBhY";
const CHALLENGE_ID=1;
const SKEY="engtoon_challenge_student";

async function rpc(name, params){
  const r=await fetch(SUPA_URL+"/rest/v1/rpc/"+name,{
    method:"POST",
    headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(params||{})
  });
  const t=await r.text();
  if(!r.ok) throw new Error(t||("HTTP "+r.status));
  return t?JSON.parse(t):null;
}

let ME=null;        /* {id, name, nickname, expires_at} */
let UNITS=[];       /* [{unit_no,total,done}] */
let EXPIRED=false;
let UNLOCK_OVERRIDE=null; /* 기수별 오픈 값 (예: 65 = 65번까지 순서상관없이 열림), null이면 순차잠금 그대로 */
let QNA_ENABLED=true;     /* 기수별 Q&A 사용 여부 */
let MY_COHORT=null;       /* {cohort_id, cohort_name} | false(미배정) | null(아직 안불러옴) */

function toastRoot(msg){
  const t=document.getElementById("toastRoot");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),2200);
}
const SCR={login:"scr-login",home:"scr-home",units:"scr-units",study:"scr-study",medals:"scr-medals",quiz:"scr-quiz",qna:"scr-qna",settings:"scr-settings",weeks:"scr-weeks",cert:"scr-cert"};
function show(name){
  for(const k in SCR) document.getElementById(SCR[k]).hidden=(k!==name);
  window.scrollTo(0,0);
}

/* ================= 로그인 ================= */
async function doLogin(){
  const id=document.getElementById("lg-id").value.trim();
  const pw=document.getElementById("lg-pw").value;
  const err=document.getElementById("lg-err");
  err.classList.remove("show");
  if(!id||!pw){err.textContent="아이디와 비밀번호를 입력해 주세요";err.classList.add("show");return;}
  const btn=document.getElementById("lg-btn");
  btn.disabled=true;btn.textContent="확인 중...";
  try{
    const rows=await rpc("student_login",{p_login_id:id,p_pw:pw});
    if(!rows||!rows.length){
      err.textContent="아이디 또는 비밀번호가 올바르지 않아요";err.classList.add("show");
    }else{
      ME=rows[0];
      ME.login_id=id;
      localStorage.setItem(SKEY,JSON.stringify(ME));
      await enterHome();
    }
  }catch(e){
    err.textContent="서버 연결에 실패했어요. 잠시 후 다시 시도해 주세요";err.classList.add("show");
  }
  btn.disabled=false;btn.textContent="시작하기 ▶";
}
function doLogout(){
  localStorage.removeItem(SKEY);ME=null;UNITS=[];
  show("login");
  document.getElementById("lg-id").value="";document.getElementById("lg-pw").value="";
}

/* ================= 홈 ================= */
function daysLeftFn(){
  const today=new Date();today.setHours(0,0,0,0);
  return Math.round((new Date(ME.expires_at+"T00:00:00")-today)/86400000);
}
function nextUnitNo(){
  for(const u of UNITS){ if(u.done<u.total) return u.unit_no; }
  return null;
}
function unitState(u){
  const nxt=nextUnitNo();
  if(u.done>=u.total) return "done";
  if(u.unit_no===nxt) return u.done>0?"part":"next";
  if(UNLOCK_OVERRIDE&&u.unit_no<=UNLOCK_OVERRIDE) return "open";
  return "locked";
}
async function enterHome(){
  show("home");
  document.getElementById("homeStage").innerHTML='<div class="loading">불러오는 중...</div>';
  try{
    UNITS=await rpc("get_my_units",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID})||[];
    try{
      const flags=await rpc("get_student_flags",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID});
      const f=flags&&flags[0];
      UNLOCK_OVERRIDE=f?f.unlock_until_unit:null;
      QNA_ENABLED=f?f.qna_enabled!==false:true;
      MY_COHORT=f?{cohort_id:f.cohort_id,cohort_name:f.cohort_name}:false;
    }catch(e){UNLOCK_OVERRIDE=null;QNA_ENABLED=true;MY_COHORT=false;}
  }catch(e){
    document.getElementById("homeStage").innerHTML='<div class="loading">데이터를 불러오지 못했어요.<br>새로고침 해주세요.</div>';return;
  }
  const dl=daysLeftFn();
  EXPIRED=dl<0;
  const doneUnits=UNITS.filter(u=>u.done>=u.total).length;
  const doneExprs=UNITS.reduce((a,u)=>a+u.done,0);
  const nxt=nextUnitNo();
  const finished=!nxt; /* 전체 완주 */
  const nick=ME.nickname||ME.login_id||ME.name;
  document.getElementById("homeStage").innerHTML=`
    ${EXPIRED?(finished
      ?`<div class="expbanner" style="background:#FFF9E3"><div class="t" style="color:#B8860B">🎓 완주 졸업생이에요!</div><div class="d">챌린지를 끝까지 해냈어요. 아래 기록은 계속 간직돼요.</div></div>`
      :`<div class="expbanner"><div class="t">⏰ 이용 기간이 종료됐어요</div><div class="d">그동안의 기록은 유지돼요. 연장은 잉툰쌤에게 문의해 주세요!</div></div>`)
    :(dl<=7?`<div class="expbanner" style="background:#FFF9E3"><div class="t" style="color:#B8860B">⏰ 이용 기간이 D-${dl} 남았어요</div><div class="d">연장이 필요하면 잉툰쌤에게 미리 문의해 주세요!</div></div>`:'')}
    <div class="card">
      <div class="card-b">
        <div class="hello">${escapeHtml(nick)}님, 반가워요! 👋</div>
        <div class="hello-sub">이용 기간 ${ME.expires_at} 까지 ${dl>=0?`(D-${dl})`:'(만료)'}</div>
      </div>
    </div>
    ${EXPIRED?'<div id="gradStats"></div>':''}
    <div class="sumrow">
      <div class="sumtile"><div class="v">${doneUnits}</div><div class="k">완료 유닛</div></div>
      <div class="sumtile"><div class="v">${doneExprs}</div><div class="k">배운 표현</div></div>
      <div class="sumtile"><div class="v">${UNITS.length}</div><div class="k">전체 유닛</div></div>
    </div>
    <div class="card">
      <div class="card-h"><b>📖 오늘의 학습</b></div>
      <div class="card-b">
        ${nxt?`
        <div class="today-unit">UNIT ${nxt}</div>
        <div class="today-sub">낭독 → 따라쓰기 → 작문 · 예상 20분</div>
        ${EXPIRED?`<div class="hello-sub">이용 기간이 끝나 새 학습은 잠겨 있어요. 완료한 유닛은 계속 볼 수 있어요!</div>`
        :`<button class="bigbtn" onclick="openStudy(${nxt})">학습 시작하기 ▶</button>`}`
        :`<div class="today-unit">🏆 전체 완주!</div>
        <div class="today-sub">모든 유닛을 완료했어요. 정말 대단해요!</div>
        <button class="bigbtn" onclick="openCert()">📜 내 수료증 보기 ▶</button>`}
      </div>
    </div>
    <div style="display:flex;gap:9px;margin-bottom:9px">
      <button class="mini" style="flex:1;text-align:center" onclick="openUnits()">📚 유닛 목록</button>
      <button class="mini" style="flex:1;text-align:center" onclick="openMedals()">🏅 내 메달</button>
    </div>
    <div style="display:flex;gap:9px;margin-bottom:9px">
      <button class="mini y" style="flex:1;text-align:center" onclick="openQuizIntro()">🧩 복습 퀴즈</button>
      <button class="mini" style="flex:1;text-align:center" onclick="openQna()">💬 Q&amp;A${QNA_ENABLED?'':' <span style="font-size:9px;color:#7b93a4">(준비중)</span>'}</button>
    </div>
    <button class="mini" style="width:100%;text-align:center" onclick="openWeeks()">📆 주차 현황</button>`;
  if(EXPIRED)loadGradStats();
}

/* 만료/졸업생: 나의 기록 요약 */
async function loadGradStats(){
  const box=document.getElementById("gradStats");
  if(!box)return;
  try{
    const rows=await rpc("get_my_stats",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID});
    const s=rows&&rows[0];
    if(!s)return;
    box.innerHTML=`
      <div class="card">
        <div class="card-h"><b>📜 나의 챌린지 기록</b></div>
        <div class="card-b">
          <div class="sumrow" style="margin-bottom:9px">
            <div class="sumtile"><div class="v">${s.exprs_done}</div><div class="k">배운 표현</div></div>
            <div class="sumtile"><div class="v">${s.speak_total}</div><div class="k">낭독 횟수</div></div>
            <div class="sumtile"><div class="v">${s.write_total}</div><div class="k">쓴 문장</div></div>
          </div>
          <div class="sumrow" style="margin-bottom:0">
            <div class="sumtile"><div class="v">${s.quiz_count}</div><div class="k">퀴즈 풀이</div></div>
            <div class="sumtile"><div class="v">${s.quiz_best}점</div><div class="k">퀴즈 최고점</div></div>
            <div class="sumtile"><div class="v">${s.medal_count}</div><div class="k">획득 메달</div></div>
          </div>
        </div>
      </div>`;
  }catch(e){}
}

/* ================= 유닛 목록 ================= */
function openUnits(){
  show("units");
  const cells=UNITS.map(u=>{
    const st=unitState(u);
    const clickable=st!=="locked"&&!(EXPIRED&&st!=="done");
    const label=st==="done"?"완료":st==="part"?`${u.done}/${u.total}`:st==="next"?"오늘":st==="open"?"🔓":"🔒";
    return `<div class="ucell ${st}" ${clickable?`onclick="openStudy(${u.unit_no})"`:''}>${u.unit_no}<span>${label}</span></div>`;
  }).join("");
  document.getElementById("unitsStage").innerHTML=`
    <div class="ugrid">${cells}</div>
    <div class="ulegend">🟦 오늘 학습 · 🟨 진행 중 · 🟩 완료 · 🔒 이전 유닛을 끝내면 열려요${UNLOCK_OVERRIDE?' · 🔓 우리 반은 미리 열려 있어요':''}<br>완료한 유닛은 언제든 다시 볼 수 있어요.</div>`;
}

/* ================= 학습 ================= */
let EXP=[];
let curUnit=null;
let cur=0;
let unitDoneShown=false;

async function openStudy(unitNo){
  const u=UNITS.find(x=>x.unit_no===unitNo);
  if(u&&unitState(u)==="locked"){toastRoot("이전 유닛을 먼저 끝내면 열려요");return;}
  if(EXPIRED&&u&&u.done<u.total){toastRoot("이용 기간이 끝나 새 학습은 잠겨 있어요");return;}
  curUnit=unitNo;unitDoneShown=false;
  show("study");
  document.getElementById("studyTitle").textContent="UNIT "+unitNo;
  document.getElementById("studyStage").innerHTML='<div class="loading">불러오는 중...</div>';
  try{
    const rows=await rpc("get_unit_expressions",{p_student_id:ME.id,p_unit_no:unitNo,p_challenge_id:CHALLENGE_ID})||[];
    EXP=rows.map(r=>({
      id:r.id, ord:r.order_no, title:r.title, mean:r.mean, desc:r.description,
      sent:r.sentence, ko:r.sentence_ko, mp3:r.mp3_url,
      prac:(r.practice||[]),
      speak:r.speak_count||0, copy:r.copy_count||0,
      answers:(Array.isArray(r.answers)&&r.answers.length?r.answers.slice():[]),
      done:!!r.completed
    }));
    EXP.forEach(e=>{while(e.answers.length<e.prac.length)e.answers.push(null);});
    cur=EXP.findIndex(e=>!e.done);
    if(cur<0)cur=0;
    renderStudy();
  }catch(e){
    document.getElementById("studyStage").innerHTML='<div class="loading">불러오지 못했어요. 뒤로 갔다가 다시 시도해 주세요.</div>';
  }
}

function leaveStudy(){enterHome();}

function normSent(s){
  return (s||"").toLowerCase().replace(/[\u2019\u2018]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/[.,!?;:"']/g,"").replace(/\s+/g," ").trim();
}
function speakIt(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US";u.rate=0.92;
    speechSynthesis.speak(u);
  }catch(e){}
}
function playSent(){
  const e=EXP[cur];
  if(e.mp3){
    const a=new Audio(e.mp3);
    a.play().catch(()=>speakIt(e.sent));
  }else speakIt(e.sent);
}
function playQuizSent(){
  const q=QZ[qi];const p=q.payload;
  if(q.mp3_url){
    const a=new Audio(q.mp3_url);
    a.play().catch(()=>speakIt(p.sent));
  }else speakIt(p.sent);
}
function escapeHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderStudy(){
  const e=EXP[cur];
  const pills=EXP.map((x,i)=>`<div class="pill ${x.done?'ok':''} ${i===cur?'on':''}" onclick="gotoExp(${i})">${x.done?'✓':x.ord}</div>`).join("");
  const speakDone=e.speak>=10, copyDone=e.copy>=3;

  const pracHtml=e.prac.map((p,pi)=>{
    const a=e.answers[pi];
    return `<div class="prac">
      <div class="prac-q">${pi+1}. ${escapeHtml(p.q)}</div>
      ${p.hint?`<button class="prac-hintbtn" onclick="toggleHint(${pi})">💡 힌트 보기</button>
      <div class="prac-hint" id="hint-${pi}">힌트: ${escapeHtml(p.hint)}</div>`:''}
      ${a&&a.mine?`
        <div class="model">
          <div class="ml">✍️ 내가 쓴 문장</div>
          <div class="mine">${escapeHtml(a.mine)}</div>
          <div class="ml" style="margin-top:8px">📖 모범답안 — 내 문장과 비교해 보세요</div>
          <div class="ma">${escapeHtml(p.answer||'')}</div>
        </div>`
      :`<textarea id="prac-${pi}" placeholder="영어로 써 보세요" ${EXPIRED?'disabled':''}></textarea>
        <div class="prac-btns">
          <button class="mini y" onclick="submitPrac(${pi})" ${EXPIRED?'disabled':''}>제출하고 모범답안 보기</button>
        </div>`}
    </div>`;
  }).join("");

  document.getElementById("studyStage").innerHTML=`
    <div class="pills">${pills}</div>
    <div class="card">
      <div class="card-b">
        <div class="exp-title">${escapeHtml(e.title)} ${e.done?'<span class="donetag">완료</span>':''}</div>
        <div class="exp-mean">${escapeHtml(e.mean)}</div>
        <div class="exp-desc">${escapeHtml(e.desc||'')}</div>
        <button class="mini" style="margin-top:10px;font-size:11.5px;padding:6px 12px" onclick="openQnaModal()">💬 이 표현 질문하기</button>
      </div>
    </div>

    <div class="card">
      <div class="card-b">
        <span class="steplbl">STEP 1 · 소리내어 읽기</span>
        <div class="sent">${escapeHtml(e.sent)}</div>
        <div class="sent-ko">${escapeHtml(e.ko||'')}</div>
        <div class="speakrow">
          <button class="mini" onclick="playSent()">🔊 듣기</button>
          <div class="cntbar"><i style="width:${Math.min(100,e.speak*10)}%"></i></div>
          <div class="cntnum">${Math.min(10,e.speak)}/10</div>
        </div>
        <div style="margin-top:10px">
          ${speakDone?'<span class="donetag">✓ 낭독 완료</span>'
          :`<button class="mini y" onclick="addSpeak()" ${EXPIRED?'disabled':''}>따라 읽었어요 +1</button>`}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-b">
        <span class="steplbl">STEP 2 · 따라쓰기 3회</span>
        <div class="copychecks">${[0,1,2].map(i=>`<div class="cc ${i<e.copy?'on':''}">${i<e.copy?'✓':i+1}</div>`).join('')}</div>
        ${copyDone?'<div style="margin-top:9px"><span class="donetag">✓ 따라쓰기 완료</span></div>'
        :`<div class="copyrow">
            <input id="copyInput" placeholder="위 문장을 똑같이 써 보세요" autocomplete="off" ${EXPIRED?'disabled':''}>
            <button class="mini y" onclick="checkCopy()" ${EXPIRED?'disabled':''}>확인</button>
          </div>
          <div class="copyfb" id="copyFb"></div>`}
      </div>
    </div>

    <div class="card">
      <div class="card-b">
        <span class="steplbl">STEP 3 · 문장 만들기</span>
        <div style="font-size:12px;color:#7b93a4;margin-bottom:11px">채점은 없어요. 제출하면 모범답안이 열리고, 스스로 비교하며 배워요.</div>
        ${pracHtml}
      </div>
    </div>

    <div class="navbtns">
      <button class="mini" onclick="gotoExp(${cur-1})" ${cur<=0?'disabled':''}>‹ 이전 표현</button>
      <button class="mini ${e.done?'g':''}" onclick="gotoExp(${cur+1})" ${cur>=EXP.length-1?'disabled':''}>다음 표현 ›</button>
    </div>`;
  const ci=document.getElementById("copyInput");
  if(ci) ci.addEventListener("keydown",ev=>{if(ev.key==="Enter")checkCopy();});
}

function gotoExp(i){if(i<0||i>=EXP.length)return;cur=i;renderStudy();}
function toggleHint(pi){document.getElementById("hint-"+pi).classList.toggle("show");}

function addSpeak(){
  const e=EXP[cur];
  if(e.speak>=10)return;
  e.speak++;
  if(e.speak===10){saveExp(e);toastRoot("낭독 10회 완료! 🎉");}
  renderStudy();
  checkExpDone();
}

function checkCopy(){
  const e=EXP[cur];
  const inp=document.getElementById("copyInput");
  if(!inp)return;
  if(normSent(inp.value)===normSent(e.sent)){
    e.copy++;
    saveExp(e);
    renderStudy();
    if(e.copy>=3)toastRoot("따라쓰기 3회 완료! ✍️");
    checkExpDone();
  }else{
    const fb=document.getElementById("copyFb");
    fb.textContent="음.. 문장과 조금 달라요. 다시 한번 살펴볼까요?";
    fb.style.color="var(--coral)";
  }
}

function submitPrac(pi){
  const e=EXP[cur];
  const ta=document.getElementById("prac-"+pi);
  const v=(ta&&ta.value||"").trim();
  if(!v){toastRoot("문장을 먼저 써 주세요");return;}
  e.answers[pi]={mine:v};
  saveExp(e);
  renderStudy();
  checkExpDone();
}

function checkExpDone(){
  const e=EXP[cur];
  if(e.done)return;
  if(e.speak>=10&&e.copy>=3&&e.answers.every(a=>a&&a.mine)){
    e.done=true;
    saveExp(e);
    awardCheck();
    /* 홈 카운터 즉시 반영 */
    const u=UNITS.find(x=>x.unit_no===curUnit);
    if(u)u.done=Math.min(u.total,u.done+1);
    renderStudy();
    toastRoot(`표현 ${e.ord} 완료! 🎉`);
    if(EXP.every(x=>x.done)&&!unitDoneShown){
      unitDoneShown=true;
      document.getElementById("veilTitle").textContent=`UNIT ${curUnit} 완료!`;
      setTimeout(()=>document.getElementById("unitVeil").classList.add("show"),500);
    }
  }
}

let QZ=[];        /* 세션 문제들 */
let qi=0, qScore=0, qWrong=[], qAnswered=false, qOrderPick=[], qFromUnit=null;

function openQuizIntro(){

async function startQuiz(unitNo){
  document.getElementById("quizStage").innerHTML='<div class="loading">문제를 뽑는 중...</div>';
  try{
    QZ=await rpc("get_quiz_session",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID,p_size:13,p_unit_no:unitNo||null})||[];
  }catch(e){QZ=[];}
  if(!QZ.length){
    document.getElementById("quizStage").innerHTML='<div class="loading">아직 풀 수 있는 문제가 없어요.<br>먼저 유닛 학습을 진행해 주세요!</div>';return;
  }
  qi=0;qScore=0;qWrong=[];qFromUnit=unitNo||null;
  renderQuiz();
}

function quitQuiz(){enterHome();}

function renderQuiz(){
  if(qi>=QZ.length){finishQuiz();return;}
  qAnswered=false;qOrderPick=[];
  const q=QZ[qi];const p=q.payload;
  document.getElementById("quizBadge").textContent=(qFromUnit?`U${qFromUnit} `:"")+(qi+1)+"/"+QZ.length;
  let inner="";
  if(q.qtype==="match"){
    inner=`<span class="qz-kicker">뜻 매칭</span>
      <div class="qz-q"><span class="en">${escapeHtml(p.q)}</span></div>
      <div class="qz-sub">이 표현의 뜻으로 알맞은 것은?</div>
      ${p.opts.map((o,i)=>`<button class="qz-opt" id="opt-${i}" onclick="pickOpt(${i})">${escapeHtml(o)}</button>`).join("")}`;
  }else if(q.qtype==="rmatch"){
    inner=`<span class="qz-kicker">표현 고르기</span>
      <div class="qz-q">"${escapeHtml(p.q)}"</div>
      <div class="qz-sub">이 뜻에 맞는 표현은?</div>
      ${p.opts.map((o,i)=>`<button class="qz-opt" id="opt-${i}" onclick="pickOpt(${i})" style="font-family:'Nunito';font-weight:800">${escapeHtml(o)}</button>`).join("")}`;
  }else if(q.qtype==="typein"){
    inner=`<span class="qz-kicker">표현 직접 쓰기</span>
      <div class="qz-q">"${escapeHtml(p.mean)}"</div>
      <div class="qz-sub">이 뜻의 영어 표현을 직접 써 보세요</div>
      <div class="qz-input">
        <input id="qzInput" placeholder="영어 표현" autocomplete="off">
        <button class="mini y" onclick="checkTypein()">확인</button>
      </div>
      <div id="qzFb"></div>`;
  }else if(q.qtype==="dictation"){
    inner=`<span class="qz-kicker">듣고 받아쓰기</span>
      <div class="qz-sub">문장을 듣고 그대로 써 보세요 ${p.ko?`<br>(${escapeHtml(p.ko)})`:''}</div>
      <button class="mini" onclick="playQuizSent()" style="margin-bottom:10px">🔊 다시 듣기</button>
      <div class="qz-input">
        <input id="qzInput" placeholder="들은 문장을 쓰세요" autocomplete="off">
        <button class="mini y" onclick="checkDict()">확인</button>
      </div>
      <div id="qzFb"></div>`;
    setTimeout(playQuizSent,350);
  }else if(q.qtype==="order"){
    const words=p.target.replace(/[.?!]$/,"").split(/\s+/);
    const shuffled=words.map((w,i)=>({w,i})).sort(()=>Math.random()-0.5);
    inner=`<span class="qz-kicker">문장 순서 배열</span>
      <div class="qz-q">"${escapeHtml(p.ko||'')}"</div>
      <div class="qz-sub">단어를 순서대로 눌러 문장을 완성하세요</div>
      <div class="qz-built" id="qzBuilt"></div>
      <div class="qz-words">${shuffled.map((x,si)=>`<button class="qz-word" id="qw-${si}" data-w="${escapeHtml(x.w)}" onclick="pickWord(${si})">${escapeHtml(x.w)}</button>`).join("")}</div>
      <button class="mini" onclick="resetOrder()">🔄 다시 놓기</button>
      <div id="qzFb"></div>`;
  }
  document.getElementById("quizStage").innerHTML=`
    <div class="qz-bar"><i style="width:${Math.round(qi/QZ.length*100)}%"></i></div>
    <div class="card"><div class="card-b">${inner}
      <div class="qz-nextwrap" id="qzNext" style="display:none">
        <button class="bigbtn" onclick="nextQuiz()">${qi+1<QZ.length?'다음 문제 ▶':'결과 보기 ▶'}</button>
      </div>
    </div></div>`;
  const inp=document.getElementById("qzInput");
  if(inp)inp.addEventListener("keydown",e=>{if(e.key==="Enter"){if(q.qtype==="typein")checkTypein();else checkDict();}});
}

function markAnswered(ok, fbHtml){
  if(qAnswered)return;
  qAnswered=true;
  if(ok)qScore++;
  else qWrong.push(QZ[qi]);
  const fb=document.getElementById("qzFb");
  if(fb)fb.innerHTML=`<div class="qz-fb ${ok?'good':'bad'}">${fbHtml}</div>`;
  document.getElementById("qzNext").style.display="block";
}

function pickOpt(i){
  if(qAnswered)return;
  const q=QZ[qi];const p=q.payload;
  const ok=i===p.c;
  for(let k=0;k<p.opts.length;k++){
    const b=document.getElementById("opt-"+k);
    b.disabled=true;
    if(k===p.c)b.classList.add("right");
    else if(k===i&&!ok)b.classList.add("wrong");
  }
  qAnswered=true;
  if(ok)qScore++;else qWrong.push(q);
  const wrap=document.createElement("div");
  wrap.innerHTML=`<div class="qz-fb ${ok?'good':'bad'}">${ok?'정답! 🎉':'아쉬워요!'} <b>${escapeHtml(p.exp)}</b> = ${escapeHtml(q.qtype==="match"?p.opts[p.c]:p.q)}</div>`;
  document.getElementById("qzNext").parentNode.insertBefore(wrap,document.getElementById("qzNext"));
  document.getElementById("qzNext").style.display="block";
}

function normLoose(s){
  return (s||"").toLowerCase().replace(/[\u2019\u2018]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/[.,!?;:"'~]/g,"").replace(/\s+/g," ").trim();
}
function checkTypein(){
  if(qAnswered)return;
  const q=QZ[qi];const p=q.payload;
  const v=document.getElementById("qzInput").value;
  const ok=normLoose(v)===normLoose(p.answer);
  markAnswered(ok, ok?`정답! 🎉 <b>${escapeHtml(p.answer)}</b>`:`정답은 <b>${escapeHtml(p.answer)}</b> 이에요`);
}
function checkDict(){
  if(qAnswered)return;
  const q=QZ[qi];const p=q.payload;
  const v=document.getElementById("qzInput").value;
  const ok=normLoose(v)===normLoose(p.sent);
  markAnswered(ok, ok?`정답! 🎉`:`들은 문장: <b>${escapeHtml(p.sent)}</b>`);
}
function pickWord(si){
  if(qAnswered)return;
  const b=document.getElementById("qw-"+si);
  if(!b||b.classList.contains("used"))return;
  b.classList.add("used");
  qOrderPick.push(b.getAttribute("data-w"));
  document.getElementById("qzBuilt").textContent=qOrderPick.join(" ");
  const q=QZ[qi];const p=q.payload;
  const words=p.target.replace(/[.?!]$/,"").split(/\s+/);
  if(qOrderPick.length===words.length){
    const ok=normLoose(qOrderPick.join(" "))===normLoose(p.target);
    markAnswered(ok, ok?`정답! 🎉 <b>${escapeHtml(p.target)}</b>`:`정답 문장: <b>${escapeHtml(p.target)}</b>`);
  }
}
function resetOrder(){
  if(qAnswered)return;
  qOrderPick=[];
  document.getElementById("qzBuilt").textContent="";
  document.querySelectorAll(".qz-word").forEach(b=>b.classList.remove("used"));
}
function nextQuiz(){qi++;renderQuiz();}

function finishQuiz(){
  const total=QZ.length;
  const pct=Math.round(qScore/total*100);
  /* 결과 저장 + 메달 판정 */
  saveQueue=saveQueue
    .then(()=>rpc("save_quiz_result",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID,p_score:qScore,p_total:total,
      p_detail:qWrong.map(w=>({id:w.id,exp:w.payload.exp}))}))
    .catch(()=>{});
  awardCheck();
  const wrongHtml=qWrong.length?`
    <div style="font-family:'Jua';font-size:14px;margin:16px 0 9px;text-align:left">📌 틀린 문제 다시 보기</div>
    ${qWrong.map(w=>{
      const p=w.payload;
      const line=w.qtype==="dictation"||w.qtype==="order"
        ?escapeHtml(p.sent||p.target)
        :`${escapeHtml(p.exp)}`;
      return `<div class="qz-wrongitem"><span class="we">${line}</span><br>${escapeHtml(p.mean||p.q||p.ko||'')}</div>`;
    }).join("")}`:"";
  document.getElementById("quizBadge").textContent="";
  document.getElementById("quizStage").innerHTML=`
    <div class="card"><div class="card-b">
      <div class="qz-result">
        <div class="em">${pct===100?'💯':pct>=70?'🎉':'💪'}</div>
        <h2>${qFromUnit?`UNIT ${qFromUnit} 복습 결과`:pct===100?'퍼펙트!':pct>=70?'잘했어요!':'조금만 더!'}</h2>
        <div class="sc">${qScore} / ${total}</div>
        <p>${pct===100?'전부 맞혔어요. 대단해요!':'틀린 표현은 아래에서 다시 확인해 보세요.'}<br>매번 다른 문제가 나오니 또 풀어봐도 좋아요.</p>
        <button class="bigbtn" onclick="startQuiz(qFromUnit)">🔄 ${qFromUnit?'이 유닛 다시 풀기':'한 번 더 풀기'}</button>
        <button class="mini" style="width:100%;text-align:center;margin-top:9px" onclick="openQuizUnitPicker()">📍 다른 유닛 고르기</button>
        <button class="mini" style="width:100%;text-align:center;margin-top:9px" onclick="enterHome()">홈으로</button>
      </div>
      ${wrongHtml}
    </div></div>`;
}

/* ================= 주차 현황 ================= */
const WEEK_SIZE=5; /* 두 챌린지 모두 주당 5유닛 (75/15주, 50/10주) */
let wkTab='mine';
let wkNo=1;

function totalWeeks(){return Math.max(1,Math.ceil(UNITS.length/WEEK_SIZE));}

function openWeeks(){
  /* 진행 중인(또는 마지막) 유닛이 속한 주차로 시작 */
  const nxt=nextUnitNo()||UNITS.length||1;
  wkNo=Math.max(1,Math.min(totalWeeks(),Math.ceil(nxt/WEEK_SIZE)));
  wkTab='mine';
  show("weeks");
  renderWeeks();
}

function setWkTab(t){wkTab=t;renderWeeks();}
function wkPrev(){if(wkNo>1){wkNo--;renderWeeks();}}
function wkNext(){if(wkNo<totalWeeks()){wkNo++;renderWeeks();}}

function weekRange(){
  const start=(wkNo-1)*WEEK_SIZE+1;
  const end=Math.min(UNITS.length,wkNo*WEEK_SIZE);
  return [start,end];
}

async function renderWeeks(){
  const stage=document.getElementById("weeksStage");
  const [start,end]=weekRange();
  const nav=`
    <div class="wk-nav">
      <button onclick="wkPrev()" ${wkNo<=1?'disabled':''}>‹</button>
      <div class="wk-title">${wkNo}주차 <span style="font-weight:400;font-size:11px;color:#7b93a4">(UNIT ${start}~${end})</span></div>
      <button onclick="wkNext()" ${wkNo>=totalWeeks()?'disabled':''}>›</button>
    </div>`;
  const tabs=`
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="mini ${wkTab==='mine'?'y':''}" style="flex:1;text-align:center" onclick="setWkTab('mine')">🙋 나의 진행</button>
      <button class="mini ${wkTab==='class'?'y':''}" style="flex:1;text-align:center" onclick="setWkTab('class')">👥 반 전체 보기</button>
    </div>`;
  stage.innerHTML=nav+tabs+'<div class="loading">불러오는 중...</div>';

  if(wkTab==='mine'){
    const tiles=[];
    for(let n=start;n<=end;n++){
      const u=UNITS.find(x=>x.unit_no===n);
      if(!u){tiles.push(`<div class="wk-mc locked">${n}<span>-</span></div>`);continue;}
      const st=unitState(u);
      const label=st==="done"?"완료":st==="part"?`${u.done}/${u.total}`:st==="next"?"오늘":st==="open"?"🔓":"🔒";
      tiles.push(`<div class="wk-mc ${st}" onclick="${st!=='locked'?`openStudy(${n})`:''}" style="cursor:${st!=='locked'?'pointer':'default'}">${n}<span>${label}</span></div>`);
    }
    stage.innerHTML=nav+tabs+`<div class="wk-mytiles">${tiles.join("")}</div>
      <div class="ulegend">🟦 오늘 학습 · 🟨 진행 중 · 🟩 완료 · 🔒 잠김${UNLOCK_OVERRIDE?' · 🔓 미리 열림':''}</div>`;
    return;
  }

  /* 반 전체 보기 */
  try{
    if(MY_COHORT===null){
      try{
        const rows=await rpc("get_my_cohort",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID})||[];
        MY_COHORT=rows.length?rows[0]:false;
      }catch(e){MY_COHORT=false;}
    }
    if(!MY_COHORT){
      stage.innerHTML=nav+tabs+'<div class="loading">아직 배정된 반이 없어요.<br>선생님께 문의해 주세요!</div>';
      return;
    }
    const prog=await rpc("get_cohort_week_progress",{p_cohort_id:MY_COHORT.cohort_id,p_unit_start:start,p_unit_end:end})||[];
    const byStudent={};
    prog.forEach(r=>{
      (byStudent[r.student_id]=byStudent[r.student_id]||{name:r.display_name,units:{}}).units[r.unit_no]={done:r.done,total:r.total};
    });
    const unitNums=[];for(let n=start;n<=end;n++)unitNums.push(n);
    const rows=Object.entries(byStudent).map(([sid,s])=>{
      const chips=unitNums.map(n=>{
        const d=s.units[n];
        if(!d||d.total===0)return `<div class="wk-chip z">${n}</div>`;
        if(d.done>=d.total)return `<div class="wk-chip d">${n}</div>`;
        if(d.done>0)return `<div class="wk-chip p">${n}</div>`;
        return `<div class="wk-chip z">${n}</div>`;
      }).join("");
      const isMe=String(sid)===String(ME.id);
      return `<div class="wk-roster-row ${isMe?'me':''}">
        <span class="wk-rname">${escapeHtml(s.name)}${isMe?' (나)':''}</span>
        <div class="wk-rchips">${chips}</div>
      </div>`;
    }).join("");
    stage.innerHTML=nav+tabs+`
      <div style="font-size:11px;font-weight:800;color:#7b93a4;margin-bottom:9px">${escapeHtml(MY_COHORT.cohort_name)} · ${Object.keys(byStudent).length}명</div>
      ${rows||'<div class="loading">우리 반 학생이 없어요</div>'}
      <div class="ulegend">🟩 완료 · 🟨 진행 중 · ⬜ 시작 전</div>`;
  }catch(e){
    stage.innerHTML=nav+tabs+'<div class="loading">불러오지 못했어요 (8단계 SQL이 실행됐는지 확인해 주세요)</div>';
  }
}

async function drawCertificate(info){
  /* info: get_certificate_info 결과 1행 */
  if(document.fonts&&document.fonts.ready){
    try{await Promise.all([
      document.fonts.load('64px Jua'),document.fonts.load('700 26px "Noto Sans KR"'),
      document.fonts.load('800 30px Nunito')
    ]);}catch(e){}
  }
  const W=1000,H=1414;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const x=cv.getContext("2d");
  /* 배경 */
  x.fillStyle="#FBFBF4";x.fillRect(0,0,W,H);
  /* 이중 테두리 */
  x.strokeStyle="#47AEE4";x.lineWidth=22;x.strokeRect(30,30,W-60,H-60);
  x.strokeStyle="#1E3A4F";x.lineWidth=4;x.strokeRect(62,62,W-124,H-124);
  /* 모서리 장식 점 */
  x.fillStyle="#FFD34D";
  [[62,62],[938,62],[62,1352],[938,1352]].forEach(p=>{
    x.beginPath();x.arc(p[0],p[1],14,0,Math.PI*2);x.fill();
    x.strokeStyle="#1E3A4F";x.lineWidth=3;x.stroke();x.fillStyle="#FFD34D";
  });
  x.textAlign="center";
  /* 트로피 */
  x.font="110px serif";x.fillText("🏆",W/2,235);
  /* 제목 */
  x.fillStyle="#1E3A4F";
  x.font="76px Jua, sans-serif";x.fillText("수 료 증",W/2,352);
  x.fillStyle="#7b93a4";
  x.font="800 24px Nunito, sans-serif";x.fillText("CERTIFICATE OF COMPLETION",W/2,396);
  /* 이름 */
  const dispName=info.nickname&&info.nickname!==info.student_name
    ? (info.student_name+" ("+info.nickname+")") : info.student_name;
  x.fillStyle="#2E90C8";
  x.font="62px Jua, sans-serif";x.fillText(dispName,W/2,530);
  x.strokeStyle="#FFD34D";x.lineWidth=6;
  const nw=Math.min(560,x.measureText(dispName).width+70);
  x.beginPath();x.moveTo(W/2-nw/2,552);x.lineTo(W/2+nw/2,552);x.stroke();
  if(info.cohort_name){
    x.fillStyle="#7b93a4";
    x.font="700 26px 'Noto Sans KR', sans-serif";x.fillText(info.cohort_name,W/2,596);
  }
  /* 본문 */
  x.fillStyle="#1E3A4F";
  x.font="700 30px 'Noto Sans KR', sans-serif";
  const lines=[
    "위 학생은 잉툰TV",
    "『"+info.challenge_name+"』",
    "전 "+info.units_total+"개 유닛의 학습 과정을",
    "성실히 완주하였기에",
    "이 증서를 수여합니다."
  ];
  lines.forEach((l,i)=>x.fillText(l,W/2,690+i*56));
  /* 기록 요약 */
  x.fillStyle="#2E90C8";
  x.font="800 26px 'Noto Sans KR', sans-serif";
  x.fillText("표현 "+info.exprs_done+"개 · 낭독 "+info.speak_total+"회 · 작문 "+info.write_total+"문장",W/2,1030);
  x.fillText("퀴즈 "+info.quiz_count+"회 · 메달 "+info.medal_count+"개",W/2,1072);
  /* 날짜 */
  const d=info.last_done?new Date(info.last_done+"T00:00:00"):new Date();
  x.fillStyle="#1E3A4F";
  x.font="700 28px 'Noto Sans KR', sans-serif";
  x.fillText(d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일",W/2,1170);
  /* 서명 */
  x.font="44px Jua, sans-serif";x.fillText("잉툰TV · 잉툰쌤",W/2,1250);
  /* 도장 */
  x.strokeStyle="#FF7B6B";x.lineWidth=5;
  x.beginPath();x.arc(W/2+250,1235,46,0,Math.PI*2);x.stroke();
  x.fillStyle="#FF7B6B";x.font="30px Jua, sans-serif";
  x.fillText("잉툰",W/2+250,1228);x.fillText("도장",W/2+250,1260);
  return cv;
}

let _certCanvas=null;
async function openCert(){
  show("cert");
  const stage=document.getElementById("certStage");
  stage.innerHTML='<div class="loading">수료증을 만드는 중... 🎨</div>';
  try{
    const rows=await rpc("get_certificate_info",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID});
    const info=rows&&rows[0];
    if(!info){stage.innerHTML='<div class="loading">정보를 불러오지 못했어요</div>';return;}
    if(Number(info.units_done)<Number(info.units_total)){
      stage.innerHTML=`<div class="card"><div class="card-b" style="text-align:center;padding:36px 16px">
        <div style="font-size:44px">🔒</div>
        <div style="font-family:'Jua';font-size:16px;margin-top:10px">아직 조금 남았어요!</div>
        <div style="font-size:12.5px;color:#7b93a4;margin-top:6px;line-height:1.7">
          ${info.units_done} / ${info.units_total} 유닛 완료<br>전체 완주하면 수료증이 열려요. 파이팅! 💪
        </div></div></div>`;
      return;
    }
    _certCanvas=await drawCertificate(info);
    const url=_certCanvas.toDataURL("image/png");
    stage.innerHTML=`
      <img src="${url}" style="width:100%;border:2.5px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);margin-bottom:14px" alt="수료증">
      <button class="bigbtn" onclick="saveCert()">🖼 이미지로 저장하기</button>
      <div style="font-size:11.5px;color:#7b93a4;text-align:center;margin-top:9px">저장이 안 되면 수료증 이미지를 길게 눌러 저장할 수도 있어요</div>`;
  }catch(e){
    stage.innerHTML='<div class="loading">불러오지 못했어요 (11단계 SQL이 실행됐는지 확인해 주세요)</div>';
  }
}

function saveCert(){
  if(!_certCanvas)return;
  try{
    _certCanvas.toBlob(b=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(b);
      a.download="잉툰챌린지_수료증_"+(ME.nickname||ME.login_id||ME.name)+".png";
      document.body.appendChild(a);a.click();a.remove();
      toastRoot("수료증 이미지를 저장했어요! 🎉");
    },"image/png");
  }catch(e){toastRoot("이미지를 길게 눌러 저장해 주세요");}
}

let qnaTab='all';   /* 'all' | 'mine' */
let qnaUnitFilter=null;
let qnaBestOnly=false;

function openQnaModal(){
  if(!QNA_ENABLED){toastRoot("🚧 질문 게시판은 아직 준비 중이에요");return;}
  if(EXPIRED){toastRoot("이용 기간이 끝나 질문은 잠겨 있어요");return;}
  const e=EXP[cur];
  document.getElementById("qnaTag").textContent=`UNIT ${curUnit} · ${e.title} 에 대한 질문이에요`;
  document.getElementById("qnaText").value="";
  document.getElementById("qnaPrivate").checked=false;
  document.getElementById("qnaVeil").classList.add("show");
}
function closeQnaModal(){document.getElementById("qnaVeil").classList.remove("show");}

async function submitQna(){
  const txt=document.getElementById("qnaText").value.trim();
  if(txt.length<5){toastRoot("질문을 조금 더 자세히 적어 주세요");return;}
  const e=EXP[cur];
  try{
    await rpc("create_qna",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID,
      p_unit_no:curUnit,p_expression_id:e.id,p_question:txt,
      p_is_private:document.getElementById("qnaPrivate").checked});
    closeQnaModal();
    toastRoot("질문이 등록됐어요! 잉툰쌤이 답변하면 Q&A에서 확인할 수 있어요 💬");
  }catch(err){toastRoot("등록에 실패했어요. 잠시 후 다시 시도해 주세요");}
}

function openQna(){
  show("qna");
  if(!QNA_ENABLED){
    document.getElementById("qnaStage").innerHTML=`
      <div class="card"><div class="card-b" style="text-align:center;padding:40px 16px">
        <div style="font-size:44px">🚧</div>

function setQnaTab(t){qnaTab=t;renderQna();}
function setQnaUnit(v){qnaUnitFilter=v?parseInt(v):null;renderQna();}
function toggleQnaBest(){qnaBestOnly=!qnaBestOnly;renderQna();}

function fmtDate(ts){return ts?String(ts).slice(0,10):"";}

async function renderQna(){
  const stage=document.getElementById("qnaStage");
  stage.innerHTML='<div class="loading">불러오는 중...</div>';
  const tabs=`
    <div style="display:flex;gap:8px;margin-bottom:13px">
      <button class="mini ${qnaTab==='all'?'y':''}" style="flex:1;text-align:center" onclick="setQnaTab('all')">📖 모두의 질문</button>
      <button class="mini ${qnaTab==='mine'?'y':''}" style="flex:1;text-align:center" onclick="setQnaTab('mine')">🙋 내 질문</button>
    </div>`;
  try{
    if(qnaTab==='all'){
      const rows=await rpc("get_public_qna",{p_challenge_id:CHALLENGE_ID,p_unit_no:qnaUnitFilter,p_best_only:qnaBestOnly})||[];
      const learnedUnits=UNITS.filter(u=>u.done>0).map(u=>u.unit_no);
      const unitOpts=['<option value="">전체 유닛</option>']
        .concat(learnedUnits.map(n=>`<option value="${n}" ${qnaUnitFilter===n?'selected':''}>UNIT ${n}</option>`)).join("");
      const filter=`
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:13px">
          <select onchange="setQnaUnit(this.value)" style="flex:1;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;font-family:'Noto Sans KR';background:#fff">${unitOpts}</select>
          <button class="mini ${qnaBestOnly?'g':''}" onclick="toggleQnaBest()">⭐ 베스트만</button>
        </div>`;
      const list=rows.length?rows.map(r=>`
        <div class="card"><div class="card-b" style="padding:12px 14px">
          <div style="font-size:11px;font-weight:800;color:var(--sky-deep);margin-bottom:5px">
            ${r.is_best?'⭐ ':''}UNIT ${r.unit_no}${r.expr_title?' · '+escapeHtml(r.expr_title):''} · ${r.cohort_name?`<span class="tagpill">${escapeHtml(r.cohort_name)}</span>`:''}${escapeHtml(r.nickname)}
          </div>
          <div style="font-size:13.5px;font-weight:700;margin-bottom:8px">Q. ${escapeHtml(r.question)}</div>
          <div style="background:var(--sky-soft);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.7">
            <b style="color:var(--sky-deep)">잉툰쌤</b> ${escapeHtml(r.answer)}
          </div>
        </div></div>`).join("")
      :'<div class="loading">아직 공개된 질문이 없어요.<br>학습하다 궁금한 게 생기면 첫 질문의 주인공이 되어 보세요!</div>';
      stage.innerHTML=tabs+filter+list;
    }else{
      const rows=await rpc("get_my_qna",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID})||[];
      const list=rows.length?rows.map(r=>`
        <div class="card"><div class="card-b" style="padding:12px 14px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
            <span style="font-size:11px;font-weight:800;color:var(--sky-deep)">UNIT ${r.unit_no}${r.expr_title?' · '+escapeHtml(r.expr_title):''}</span>
            ${r.is_private?'<span style="font-size:10px">🔒</span>':''}
            ${r.is_best?'<span style="font-size:10px">⭐베스트</span>':''}
            <span style="margin-left:auto;font-size:10.5px;color:#7b93a4">${fmtDate(r.created_at)}</span>
          </div>
          <div style="font-size:13.5px;font-weight:700;margin-bottom:8px">Q. ${escapeHtml(r.question)}</div>
          ${r.answer?`
          <div style="background:var(--sky-soft);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.7">
            <b style="color:var(--sky-deep)">잉툰쌤</b> ${escapeHtml(r.answer)}
          </div>`
          :'<div style="font-size:12px;font-weight:700;color:#B8860B;background:#FFF9E3;border-radius:10px;padding:8px 12px">⏳ 잉툰쌤이 답변을 준비하고 있어요</div>'}
        </div></div>`).join("")
      :'<div class="loading">아직 등록한 질문이 없어요.<br>학습 화면의 💬 버튼으로 언제든 질문할 수 있어요!</div>';
      stage.innerHTML=tabs+list;
    }
  }catch(e){
    stage.innerHTML=tabs+'<div class="loading">불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>';
  }
}

/* ================= 메달 ================= */
/* 정의는 앱에, 획득 기록은 DB에. 판정은 서버(check_and_award_medals)가 실데이터로 수행 */
const MEDAL_DEFS=[
 {cat:"🗺️ 여정", items:[1,5,10,15,20,25,30,35,40,45,50,55,60,65,70,75].map(n=>({key:"unit-"+n,icon:"🏅",name:"UNIT "+n+" 완료"}))},
 {cat:"📖 표현 수집", items:[10,25,50,75,100,150,200,250,300,350,375].map(n=>({key:"expr-"+n,icon:n>=375?"👑":n>=200?"💎":n>=100?"📚":"📖",name:"표현 "+n+"개"}))},
 {cat:"🔊 낭독왕", items:[100,300,500,1000,2000,3000,3750].map(n=>({key:"speak-"+n,icon:n>=3000?"🎤":n>=1000?"📢":"🔊",name:"낭독 "+n+"회"}))},
 {cat:"✍️ 필사왕", items:[30,100,300,600,900,1125].map(n=>({key:"copy-"+n,icon:n>=900?"🖋️":"✍️",name:"따라쓰기 "+n+"회"}))},
 {cat:"📝 작문왕", items:[20,50,150,300,500,750].map(n=>({key:"write-"+n,icon:n>=500?"🏅":"📝",name:"작문 "+n+"문장"}))},
 {cat:"🧩 복습 퀴즈", items:[1,5,10,20,30,50].map(n=>({key:"quiz-"+n,icon:n>=30?"🎖️":"🧩",name:"퀴즈 "+n+"회"}))},
 {cat:"💯 퍼펙트", items:[1,5,10].map(n=>({key:"qperfect-"+n,icon:"💯",name:"만점 "+n+"회"}))}
];
const MEDAL_NAME={};
MEDAL_DEFS.forEach(c=>c.items.forEach(m=>MEDAL_NAME[m.key]=m.name));
let MY_MEDALS=new Set();
let NEW_MEDALS=new Set();

function awardCheck(){
  /* 저장 큐 뒤에 이어붙여 최신 데이터 기준으로 판정 */
  saveQueue=saveQueue.then(async()=>{
    try{
      const rows=await rpc("check_and_award_medals",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID})||[];
      if(rows.length){
        rows.forEach(r=>{MY_MEDALS.add(r.medal_key);NEW_MEDALS.add(r.medal_key);});
        const names=rows.map(r=>MEDAL_NAME[r.medal_key]||r.medal_key);
        toastRoot("🏅 새 메달! "+names.slice(0,2).join(", ")+(names.length>2?" 외 "+(names.length-2)+"개":""));
      }
    }catch(e){}
  });
}

async function openMedals(){
  show("medals");
  document.getElementById("medalStage").innerHTML='<div class="loading">불러오는 중...</div>';
  try{
    const rows=await rpc("get_my_medals",{p_student_id:ME.id,p_challenge_id:CHALLENGE_ID})||[];
    MY_MEDALS=new Set(rows.map(r=>r.medal_key));
  }catch(e){}
  const total=MEDAL_DEFS.reduce((a,c)=>a+c.items.length,0);
  const got=MEDAL_DEFS.reduce((a,c)=>a+c.items.filter(m=>MY_MEDALS.has(m.key)).length,0);
  const cats=MEDAL_DEFS.map(c=>{
    const gotN=c.items.filter(m=>MY_MEDALS.has(m.key)).length;
    const grid=c.items.map(m=>{
      const has=MY_MEDALS.has(m.key);
      const isNew=NEW_MEDALS.has(m.key);
      return `<div class="medal ${has?'':'locked'} ${isNew?'new':''}">
        <div class="mi">${has?m.icon:'🔒'}</div>
        <div class="mn">${m.name}</div>
      </div>`;
    }).join("");
    return `<div class="mcat">${c.cat}<span class="mc-cnt">${gotN}/${c.items.length}</span></div><div class="mgrid">${grid}</div>`;
  }).join("");
  document.getElementById("medalStage").innerHTML=`
    <div class="msum">
      <div class="mt">🏅 ${got} / ${total} 획득</div>
      <div class="md">유닛을 완료하고 낭독·쓰기를 쌓을수록 메달이 열려요. 퀴즈·시험 메달은 곧 추가돼요!</div>
    </div>
    ${cats}`;
  NEW_MEDALS.clear();
}
